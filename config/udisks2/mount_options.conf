[defaults]
vfat_defaults=uid=$UID,gid=$GID,shortname=mixed,utf8=1,showexec,flush
exfat_defaults=uid=$UID,gid=$GID,iocharset=utf8,flush
ntfs_defaults=uid=$UID,gid=$GID,ro,windows_names,noatime
ntfs:ntfs3_defaults=uid=$UID,gid=$GID,ro,windows_names,noatime
ntfs:ntfs-3g_defaults=uid=$UID,gid=$GID,ro,windows_names,noatime

[allow]
vfat_allow=uid=$UID,gid=$GID,flush,utf8,shortname,umask,dmask,fmask,codepage,iocharset,showexec
exfat_allow=uid=$UID,gid=$GID,flush,iocharset,namecase,umask,dmask,fmask
ntfs_allow=uid=$UID,gid=$GID,umask,dmask,fmask,locale,utf8,ro,rw,windows_names,noatime
