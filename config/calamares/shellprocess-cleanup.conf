dontChroot: false
timeout: 45
script:
    - "rm -f /home/*/Desktop/calamares.desktop"
    - "rm -f /etc/skel/Desktop/calamares.desktop"
    - "rm -f /usr/share/applications/calamares.desktop"
    - "rm -f /usr/local/bin/raytolfas-install"
    - "for u in $(awk -F: '$3 >= 1000 && $3 < 60000 {print $1}' /etc/passwd); do usermod -aG sudo,input,video,render,audio,plugdev \"$u\" 2>/dev/null || true; done"
    - "/usr/local/bin/btrfs-auto-snapshot create initial-install 2>/dev/null || true"
